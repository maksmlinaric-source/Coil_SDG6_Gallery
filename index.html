<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Online Gallery</title>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Online Gallery</title>
    <!-- Link to your new external style sheet -->
    <link rel="stylesheet" href="style.css">
</head>

</head>
<body>

    <header>
        <h1>My Online Gallery</h1>
        <p>A simple showcase hosted directly on GitHub Pages</p>
    </header>

    <!-- Gallery Grid -->
    <div class="gallery-container">
        <!-- Item 1 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="https://picsum.photos" alt="Beautiful Landscape">
        </div>
        <!-- Item 2 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="https://picsum.photos" alt="City Skyline">
        </div>
        <!-- Item 3 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="https://picsum.photos" alt="Ocean Waves">
        </div>
        <!-- Item 4 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="https://picsum.photos" alt="Forest Pathway">
        </div>
        <!-- Item 5 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="https://picsum.photos" alt="Mountain Peak">
        </div>
        <!-- Item 6 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="https://picsum.photos" alt="Desert Dunes">
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="Enlarged view">
    </div>

    <!-- Lightbox Logic -->
    <script>
        function openLightbox(element) {
            const modal = document.getElementById("lightboxModal");
            const lightboxImg = document.getElementById("lightboxImg");
            const clickedImgSrc = element.querySelector("img").src;
            
            lightboxImg.src = clickedImgSrc;
            modal.style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightboxModal").style.display = "none";
        }
    </script>

</body>
</html>
