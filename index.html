<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Gallery</h1>
    <p>A little collection of favorite moments</p>
  </header>

  <main class="gallery">
    <figure><img src="https://picsum.photos/id/1015/600/400" alt="River valley"><figcaption>River valley</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1016/600/400" alt="Canyon"><figcaption>Canyon</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1018/600/400" alt="Mountains"><figcaption>Mountains</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1019/600/400" alt="Coast"><figcaption>Coast</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1020/600/400" alt="Bear"><figcaption>Bear</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1024/600/400" alt="Bird"><figcaption>Bird</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1035/600/400" alt="Waterfall"><figcaption>Waterfall</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1039/600/400" alt="Forest falls"><figcaption>Forest falls</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1043/600/400" alt="Lake"><figcaption>Lake</figcaption></figure>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="close" id="close">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <footer>
    <p>&copy; 2026 My Gallery</p>
  </footer>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('open');
      });
    });

    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') lightbox.classList.remove('open');
    });
  </script>

</body>
</html>
